host: localhost:8080
info:
  contact:
    email: support@zpmeow.com
    name: zpmeow API Support
    url: https://github.com/your-username/zpmeow
  description: A WhatsApp API server built with Go, inspired by wuzapi
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: zpmeow WhatsApp API
  version: "1.0"
paths:
  /health:
    get:
      consumes:
      - application/json
      description: Returns the health status of the service using standardized response
        format
      produces:
      - application/json
      responses:
        "200":
          description: Service is healthy
          schema:
            $ref: '#/definitions/handlers.HealthStandardResponse'
      summary: Health check endpoint
      tags:
      - Health
  /ping:
    get:
      consumes:
      - application/json
      description: Simple ping endpoint that returns pong using standardized response
        format
      produces:
      - application/json
      responses:
        "200":
          description: Pong response
          schema:
            $ref: '#/definitions/handlers.HealthStandardResponse'
      summary: Ping endpoint
      tags:
      - Health
  /session/{sessionId}/chat/delete:
    post:
      consumes:
      - application/json
      description: Delete a message for everyone or just for me
      parameters:
      - description: Session ID
        in: path
        name: sessionId
        required: true
        type: string
      - description: Delete request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.DeleteMessageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ChatResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ChatResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ChatResponse'
      security:
      - ApiKeyAuth: []
      summary: Delete message
      tags:
      - Chat
  /session/{sessionId}/chat/download/audio:
    post:
      consumes:
      - application/json
      description: Download audio media from a message
      parameters:
      - description: Session ID
        in: path
        name: sessionId
        required: true
        type: string
      - description: Download request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.DownloadMediaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MediaDownloadResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ChatResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ChatResponse'
      security:
      - ApiKeyAuth: []
      summary: Download audio
      tags:
      - Chat
