securityDefinitions:
  ApiKeyAuth:
    description: 'API Key authentication. Simply provide your API key directly: "YOUR_API_KEY".
      The system automatically detects if it''s a Global API Key (can access all sessions
      and session management) or a Session-specific API Key (can only access the specific
      session it belongs to).'
    in: header
    name: Authorization
    type: apiKey
